name: dav
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.*
  - scipy
  - pyyaml
  - pillow
  - tqdm
  - ffmpeg
  - pip:
      # CARLA client. 0.9.15 publishes a cp310 manylinux wheel, which is why
      # this environment is pinned to Python 3.10 rather than 3.7/3.8 (the
      # versions shipped as .egg files inside the CARLA release directory).
      - carla==0.9.15
      - torch==2.5.1
      - torchvision==0.20.1
      - timm==1.0.11
      - opencv-python-headless==4.10.0.84
      - imageio==2.36.0
      - imageio-ffmpeg==0.5.1
      - fastapi==0.115.4
      - uvicorn[standard]==0.32.0
      - jinja2==3.1.4
      - pandas==2.2.3
      - matplotlib==3.9.2
      - shapely==2.0.6
      - networkx==3.4.2
      - tabulate==0.9.0
      - pytest==8.3.3

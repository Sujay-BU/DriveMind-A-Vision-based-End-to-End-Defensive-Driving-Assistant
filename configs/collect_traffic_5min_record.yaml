# Five-minute dense-traffic recording on Town10HD.
#
# Identical to collect_traffic_5min.yaml except ``allow_infractions: true``.
#
# Why: the 70% compliance rule is a *dataset* acceptance policy -- it decides
# what is fit to train on. It is the wrong gate for a diagnostic recording,
# where the point is to watch five continuous minutes of driving and see how it
# behaves, including where it goes wrong.
#
# The expert does not clear 70% over five minutes of dense downtown traffic.
# Measured across six attempts it reached 3789-5840 of 6000 frames, ending
# either at the compliance threshold (consistently 70.0% against a 70% bar) or
# by clipping roadside furniture in a tight junction. Episodes collected with
# this config are therefore NOT training data; the compliance figure is
# reported with the video so the number is never mistaken for a pass.
#
# Density note (D63): an earlier attempt used 70 scattered vehicles and 6 lead
# vehicles. Over five minutes that gridlocks downtown Town10HD -- the ego
# travelled 78 m at 0.26 m/s, stuck 0.6 m behind a queue, and scored 95.5%
# "compliance" by virtue of not moving. Seeded lead and oncoming traffic is
# kept, because exercising the following-distance and give-way rules is the
# point; the scattered background is reduced to the pilot's level so the
# vehicle can actually drive.
out_dir: data/dav_5min_record
episodes: 1
frames_per_episode: 6000
image_width: 400
image_height: 225
fps: 20

num_vehicles: 40
num_pedestrians: 20
lead_vehicles: 4
oncoming_vehicles: 6
lead_spacing: 18.0
oncoming_spacing: 22.0

warmup_frames: 40
towns: ["Town10HD"]
seed: 8811
max_attempts_per_episode: 4
jpeg_quality: 90
carla_host: 127.0.0.1
carla_port: 2000
traffic_manager_port: 8000
timeout: 300.0
allow_infractions: true
trace_csv: true
